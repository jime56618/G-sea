<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>G-SEA</title>
  <script>
    // Fallback SPA para GitHub Pages / hosts sin rewrite:
    // guarda la ruta y vuelve al index para que React Router la abra.
    (function () {
      var path = window.location.pathname + window.location.search + window.location.hash;
      try {
        sessionStorage.redirect = path;
      } catch (e) {}

      var isGithubProject =
        window.location.hostname.indexOf("github.io") !== -1;
      var base = isGithubProject ? "/gsea-dockerr/" : "/";
      window.location.replace(base);
    })();
  </script>
</head>
<body></body>
</html>
